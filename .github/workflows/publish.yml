# Publishes to npm on a version tag, with a provenance attestation.
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────────
#
# npm trusted publishing (OIDC). There is no npm token anywhere: GitHub mints
# a short-lived credential per run, and npm verifies it came from this
# repository, this workflow file and the `npm` environment (configured under
# the package's Settings → Trusted Publisher on npmjs.com). The same OIDC
# token signs the provenance attestation, so `id-token: write` below is not
# optional.
#
# ─── RELEASING ─────────────────────────────────────────────────────────────
#
#   1. bump "version" in package.json, then `npm run generate:version`
#      (src/version.ts must match; the check below fails otherwise)
#   2. commit, then:  git tag 0.1.0 && git push origin 0.1.0
#
# A published version can never be reused, even after `npm unpublish`.

name: Publish

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Mints the OIDC token used for trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `lts/*`, not a pinned 22: trusted publishing needs npm >= 11.5.1
          # and Node 22.23.2 ships npm **10.9.8**. The 0.2.0 release failed on
          # exactly that — npm never attempted the OIDC exchange and went
          # straight to `ENEEDAUTH`. The sibling n8n-nodes-firmendata workflow
          # already used `lts/*` and published the same tag without trouble.
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # --ignore-scripts: this job can mint an OIDC token that npm accepts
      # for publishing, so no dependency's lifecycle script gets to run in
      # it. esbuild & co. resolve their binaries via optionalDependencies,
      # so nothing here needs install scripts — verified by CI, which
      # installs the same way.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

      # The committed types must match the vendored contract, or we ship an
      # SDK that misdescribes the API.
      - run: npm run generate
      - run: git diff --exit-code -- src/schema.ts src/version.ts

      - name: Tag must match the package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Deliberately empty: setup-node would otherwise export a placeholder
          # token. With no token, npm authenticates through the OIDC exchange.
          NODE_AUTH_TOKEN: ''
